<div class="alt-titles-modal-content" role="dialog" aria-labelledby="alt-titles-title">
	<div class="modal-header">
		<h2 id="alt-titles-title">Títulos Alternativos</h2>
	</div>

	<div class="modal-body">
		<div class="list-manager">
			<div class="scrollable-list" cdkDropList (cdkDropListDropped)="onAltTitleDrop($event)">
				@for (title of alternativeTitles(); track title; let i = $index) {
					<div class="list-item" cdkDrag>
						<div class="drag-handle" cdkDragHandle>
							<app-icons name="list" size="20" />
						</div>
						<div class="title-with-flag">
							<img [src]="title.languageCode | flag" alt="Flag" class="flag-icon" />
							<span class="item-text">{{ title.title }}</span>
						</div>
						<app-select
							[ngModel]="title.languageCode"
							(ngModelChange)="updateAltTitleLang(i, $event)"
							[options]="languageCodes"
							placeholder="Idioma"
							class="lang-select"
						/>
						<button type="button" class="remove-btn" (click)="removeAltTitle(i)">
							<app-icons name="trash" size="18" />
						</button>
					</div>
				}
				@if (alternativeTitles().length === 0) {
					<div class="empty-state">Nenhum título alternativo cadastrado.</div>
				}
			</div>
			
			<div class="add-row">
				<app-input
					type="text"
					[ngModel]="newAltTitle()"
					(ngModelChange)="newAltTitle.set($event)"
					placeholder="Novo título alternativo"
					(keyup.enter)="addAltTitle()"
				/>
				<app-select
					[ngModel]="newLanguageCode()"
					(ngModelChange)="newLanguageCode.set($event)"
					[options]="languageCodes"
					placeholder="Idioma"
					class="lang-select"
				/>
				<app-button variant="primary" (click)="addAltTitle()" [disabled]="!newAltTitle().trim()">
					<app-icons name="plus" size="20" />
				</app-button>
			</div>
		</div>
	</div>

	<div class="modal-footer">
		<app-button
			variant="outline"
			(click)="onCancel()"
			[disabled]="isSaving()"
		>
			Cancelar
		</app-button>
		<app-button
			variant="primary"
			(click)="onSave()"
			[disabled]="isSaving()"
		>
			@if (isSaving()) {
				<span>Salvando...</span>
			} @else {
				<span>Salvar Alterações</span>
			}
		</app-button>
	</div>
</div>
