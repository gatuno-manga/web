<div class="success-content" role="status" aria-labelledby="success-title">
	<div class="icon-success" aria-hidden="true">
		<app-icons name="circle-check" size="64" />
	</div>

	<h2 id="success-title">{{ title() }}</h2>
	<p class="main-message">{{ message() }}</p>

	@if (hasItems()) {
		<div class="items-list">
			<strong>{{ itemsTitle() }}</strong>
			<ul>
				@for (item of items(); track $index) {
					<li>
						<app-icons name="check-circle" size="16" />
						{{ item }}
					</li>
				}
			</ul>
		</div>
	}

	@if (hasAction()) {
		<div class="settings-footer">
			<app-button variant="outline" (click)="actionCallback()!()">
				{{ actionLabel() }}
			</app-button>
		</div>
	}
</div>
