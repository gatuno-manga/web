<aside class="side-nav">
	<div class="nav-header">
		<button type="button" class="close-btn" (click)="onClose()" aria-label="Fechar menu">
			<app-icons name="close" size="20" />
		</button>
		<div class="brand">
			<app-icons
				id="logo"
				name="logo"
				size="36"
				[class.dark-theme]="isDarkTheme()"
			/>
			<h1 class="title">Gatuno</h1>
		</div>
	</div>

	<div class="nav-groups">
		@for (group of navGroups; track $index) {
			<nav class="group">
				@for (item of group.items; track item.label) {
					@if (item.route) {
						<a
							[routerLink]="item.route"
							routerLinkActive="active"
							[routerLinkActiveOptions]="{ exact: item.route === '/' }"
							class="nav-item"
							(click)="onClose()"
						>
							<app-icons [name]="item.icon" size="22" />
							<span class="label">{{ item.label }}</span>
						</a>
					} @else {
						<button
							class="nav-item"
							(click)="item.action ? item.action() : onClose()"
						>
							<app-icons [name]="item.icon" size="22" />
							<span class="label">{{ item.label }}</span>
						</button>
					}
				}
			</nav>
			@if (!$last) {
				<div class="divider"></div>
			}
		}
	</div>
</aside>
