<div class="form-block" id="register-form">
  <!-- Header -->
  <div class="form-header">
    <div class="form-icon-wrap">
      <app-icons name="user" size="32px" class="form-header-icon" />
    </div>
    <h1 class="form-title">Crie sua conta</h1>
    <p class="form-subtitle">Comece a explorar seu universo de leitura</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form" novalidate>
    <app-input
      formControlName="email"
      label="E-mail"
      placeholder="exemplo@email.com"
      id="email"
      type="email"
      leftIcon="email"
      [errors]="this.form.get('email')?.errors"
      [touched]="this.form.get('email')?.touched ?? false"
    />
    <app-input
      formControlName="password"
      label="Senha"
      placeholder="Mínimo 8 caracteres"
      id="password"
      type="password"
      leftIcon="lock"
      [errors]="this.form.get('password')?.errors"
      [touched]="this.form.get('password')?.touched ?? false"
      [showStrength]="true"
      [showRules]="true"
    />
    <app-input
      formControlName="confirmPassword"
      label="Confirmar Senha"
      placeholder="Repita a senha acima"
      id="confirmPassword"
      type="password"
      leftIcon="lock"
      [errors]="this.form.get('confirmPassword')?.errors"
      [touched]="this.form.get('confirmPassword')?.touched ?? false"
    />

    @if (form.errors?.['registrationFailed']) {
      <div class="feedback-msg feedback-msg--error" role="alert">
        <app-icons name="alert-circle" size="16px" />
        <span>{{ form.errors?.['registrationFailed'] }}</span>
      </div>
    }

    <app-button type="submit" rounded="large" id="btn-register">
      Criar conta
    </app-button>

    <p class="auth-link">
      Já tem uma conta?
      <a [routerLink]="['../', 'login']" id="link-login">Entre aqui</a>
    </p>
  </form>
</div>
