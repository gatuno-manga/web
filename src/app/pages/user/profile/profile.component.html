@if (showPage()) {
	<section [class.list-view]="isListView()">
		@if (!isListView()) {
			<h1>Perfil</h1>
			<p class="subtitle">Gerencie suas informações pessoais e configurações de visualização do seu perfil.</p>
		}

		<div class="profile-editor">
			<form [formGroup]="profileForm" (ngSubmit)="saveProfile()">
				
				<div class="form-section">
					<h3>Banner do Perfil</h3>
					<app-file-input
						id="banner-input"
						label="Alterar Banner"
						variant="banner"
						[initialPreviewUrl]="profileSignal()?.profileBannerUrl ?? null"
						[isLoading]="isBannerLoading()"
						(fileSelected)="onBannerSelected($event)"
						[maxSize]="5"
					/>
				</div>

				<div class="form-section">
					<h3>Foto de Perfil</h3>
					<app-file-input
						id="avatar-input"
						label="Alterar Avatar"
						variant="avatar"
						[initialPreviewUrl]="profileSignal()?.profileImageUrl ?? null"
						[isLoading]="isAvatarLoading()"
						(fileSelected)="onAvatarSelected($event)"
						[maxSize]="2"
					/>
				</div>

				<div class="form-section">
					<h3>Informações Básicas</h3>
					<div class="form-group">
						<app-input
							type="text"
							id="userName"
							formControlName="userName"
							label="Nome de Usuário"
							placeholder="Ex: john_doe"
							[errors]="profileForm.get('userName')?.errors"
							[touched]="profileForm.get('userName')?.touched || false"
						/>
					</div>

					<div class="form-group">
						<app-input
							type="text"
							id="name"
							formControlName="name"
							label="Nome Completo"
							placeholder="Ex: John Doe"
							[errors]="profileForm.get('name')?.errors"
							[touched]="profileForm.get('name')?.touched || false"
						/>
					</div>
				</div>

				<div class="form-actions">
					<app-button type="submit" [disabled]="profileForm.invalid || profileForm.pristine || isLoading">
						{{ isLoading ? 'Salvando...' : 'Salvar Alterações' }}
					</app-button>
					
					<app-button variant="outline" (click)="logout()">Sair</app-button>
				</div>
			</form>
		</div>
	</section>
}
