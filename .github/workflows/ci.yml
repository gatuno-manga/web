name: CI

on:
  push:
    branches:
      - main
      - developer
  pull_request:
    branches:
      - main
      - developer

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: gatuno-manga/workflows/.github/workflows/node-ci.yml@main
    with:
      node_version: '24.11.1'
      setup_chrome: true
      test_command: "npm run test:headless"

  build-and-publish:
    needs: ci
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/developer')
    uses: gatuno-manga/workflows/.github/workflows/registry.yml@main
    with:
      image_name: gatuno-web
      image_tag: ${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}
      build_context: .
      dockerfile_path: Dockerfile.prod
      runner_labels_json: '["self-hosted","linux","x64"]'
      build_args: |
        --build-arg API_URL=${{ vars.API_URL }}
        --build-arg API_URL_SERVER=${{ vars.API_URL_SERVER }}
    secrets: inherit
